name: Keepalive

# 防止 GitHub 因仓库 60 天无活动而自动禁用定时工作流
# （saas-engine / traffic-ban 是纯定时任务，仓库无提交时会被停跑）

on:
  schedule:
    - cron: '0 6 * * 1'   # 每周一 UTC 06:00（北京 14:00）
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Touch repo activity
        run: |
          date -u > .github/keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git diff --cached --quiet || git commit -m "chore: keepalive"
          git push

